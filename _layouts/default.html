<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 18h8M12 8v20M12 8h16M12 28h16M20 8v10M20 18h8' fill='none' stroke='%23A62B63' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav aria-label="Main">
        <ul>
          {% for item in site.nav %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {% endfor %}
          {% if site.cv != "" and site.cv %}
          <li><a href="{{ site.cv | relative_url }}">CV</a></li>
          {% endif %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      {% include contact.html %}
      <p class="updated">Updated {{ site.time | date: "%B %Y" }}</p>
    </div>
  </footer>
</body>
</html>
